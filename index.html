<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>略語クイズ</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-sub: #6b6b6b;
    --border: #e0ddd6;
    --accent: #2a5caa;
    --accent-light: #e8eef8;
    --correct: #1a7a4a;
    --correct-light: #e6f5ec;
    --wrong: #c0392b;
    --wrong-light: #fdecea;
    --neutral: #8c8c8c;
  }

  body {
    font-family: 'Helvetica Neue', 'Hiragino Sans', 'Meiryo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  header {
    width: 100%;
    max-width: 560px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-sub);
  }

  /* ジャンル選択 */
  #genre-screen {
    width: 100%;
    max-width: 560px;
  }

  .genre-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text-sub);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 12px;
  }

  .genre-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }

  .genre-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .genre-btn:hover { border-color: var(--accent); background: var(--accent-light); }
  .genre-btn.selected { border-color: var(--accent); background: var(--accent-light); }

  .genre-btn .g-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .genre-btn .g-count { font-size: 12px; color: var(--text-sub); }

  .genre-btn-all {
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.15s;
    margin-bottom: 8px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .genre-btn-all:hover { opacity: 0.85; }

  .start-btn {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }
  .start-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .start-btn:active { transform: translateY(0); }

  /* クイズ画面 */
  #quiz-screen { display: none; width: 100%; max-width: 560px; }

  .quiz-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .progress-wrap {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.3s ease;
  }

  .q-counter {
    font-size: 13px;
    color: var(--text-sub);
    white-space: nowrap;
  }

  .score-disp {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .score-chip {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
  }

  .chip-correct { background: var(--correct-light); color: var(--correct); }
  .chip-wrong   { background: var(--wrong-light);   color: var(--wrong); }

  /* 問題カード */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px 28px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }

  .q-genre-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 16px;
    letter-spacing: 0.04em;
  }

  .q-prompt {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 8px;
  }

  .q-abbr {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.1;
    margin-bottom: 10px;
    color: var(--text);
  }

  .q-full {
    font-size: 14px;
    color: var(--text-sub);
    min-height: 20px;
  }

  /* 選択肢 */
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .choice-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px 14px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    line-height: 1.4;
    transition: all 0.12s;
    color: var(--text);
  }

  .choice-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .choice-btn:disabled { cursor: default; }
  .choice-btn.correct  { border-color: var(--correct); background: var(--correct-light); color: var(--correct); font-weight: 700; }
  .choice-btn.wrong    { border-color: var(--wrong); background: var(--wrong-light); color: var(--wrong); }
  .choice-btn.dim      { opacity: 0.35; }

  /* フィードバック */
  .feedback-box {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 16px;
    font-size: 14px;
    display: none;
    line-height: 1.6;
  }

  .feedback-box.correct { background: var(--correct-light); color: var(--correct); border: 1px solid #a8dfc0; }
  .feedback-box.wrong   { background: var(--wrong-light);   color: var(--wrong);   border: 1px solid #f5b4ae; }

  .next-btn {
    width: 100%;
    padding: 15px;
    background: var(--text);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: none;
    transition: all 0.15s;
  }
  .next-btn:hover { opacity: 0.85; }

  /* リザルト画面 */
  #result-screen {
    display: none;
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 28px;
    margin-bottom: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }

  .result-emoji { font-size: 56px; margin-bottom: 16px; }
  .result-title { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  .result-score { font-size: 48px; font-weight: 900; color: var(--accent); margin: 16px 0 4px; }
  .result-sub   { font-size: 15px; color: var(--text-sub); margin-bottom: 24px; }

  .result-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    text-align: center;
    margin-bottom: 8px;
  }

  .stat-box {
    background: var(--bg);
    border-radius: 10px;
    padding: 14px;
  }
  .stat-box .s-num { font-size: 26px; font-weight: 800; }
  .stat-box .s-label { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .stat-correct .s-num { color: var(--correct); }
  .stat-wrong   .s-num { color: var(--wrong); }

  .retry-btn {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 10px;
  }
  .retry-btn:hover { opacity: 0.9; }

  .back-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    color: var(--text-sub);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .back-btn:hover { background: var(--surface); color: var(--text); }
</style>
</head>
<body>

<header>
  <h1>略語クイズ</h1>
  <p class="subtitle">497問収録 ・ ジャンル別4択</p>
</header>

<!-- ジャンル選択 -->
<div id="genre-screen">
  <p class="genre-title">ジャンルを選ぶ</p>

  <button class="genre-btn-all" onclick="startQuiz('all')">
    <span>🌐 すべてのジャンル</span>
    <span style="font-size:13px;opacity:.7">497問</span>
  </button>

  <div class="genre-grid" id="genre-grid"></div>
</div>

<!-- クイズ -->
<div id="quiz-screen">
  <div class="quiz-header">
    <div class="progress-wrap"><div class="progress-bar" id="prog-bar"></div></div>
    <div class="q-counter" id="q-counter">1 / 10</div>
  </div>
  <div class="score-disp">
    <span class="score-chip chip-correct">✓ <span id="sc-correct">0</span></span>
    <span class="score-chip chip-wrong">✗ <span id="sc-wrong">0</span></span>
  </div>

  <div class="question-card">
    <div class="q-genre-tag" id="q-genre">—</div>
    <div class="q-prompt">この略語の意味は？</div>
    <div class="q-abbr" id="q-abbr">—</div>
    <div class="q-full" id="q-full"></div>
  </div>

  <div class="choices" id="choices"></div>

  <div class="feedback-box" id="feedback"></div>
  <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
</div>

<!-- リザルト -->
<div id="result-screen">
  <div class="result-card">
    <div class="result-emoji" id="result-emoji">🎉</div>
    <div class="result-title" id="result-title">ラウンド完了！</div>
    <div class="result-score" id="result-score">0%</div>
    <div class="result-sub" id="result-sub">10問中 0問正解</div>
    <div class="result-stats">
      <div class="stat-box stat-correct">
        <div class="s-num" id="rs-correct">0</div>
        <div class="s-label">正解</div>
      </div>
      <div class="stat-box stat-wrong">
        <div class="s-num" id="rs-wrong">0</div>
        <div class="s-label">不正解</div>
      </div>
    </div>
  </div>
  <button class="retry-btn" id="retry-btn" onclick="retryQuiz()">同じジャンルでもう一度</button>
  <button class="back-btn" onclick="goGenreSelect()">ジャンル選択に戻る</button>
</div>

;

const GENRE_META = {
  '01_business':             { label: 'ビジネス',         icon: '💼' },
  '02_email_chat':           { label: 'メール・チャット', icon: '✉️' },
  '03_it_web_dev':           { label: 'IT・Web開発',      icon: '💻' },
  '04_university_job_hunting':{ label: '大学・就活',       icon: '🎓' },
  '05_daily_life':           { label: '日常生活',          icon: '☕' },
  '06_sns_internet':         { label: 'SNS・ネット',       icon: '📱' },
  '07_medical_admin_life':   { label: '医療・行政',        icon: '🏥' },
  '08_transport_travel':     { label: '交通・旅行',        icon: '✈️' },
  '09_creative_video_stage': { label: 'クリエイティブ',   icon: '🎬' },
};

const QUIZ_LEN = 10;

let currentGenre = 'all';
let deck = [];
let pointer = 0;
let correctN = 0;
let wrongN = 0;
let answered = false;

// ---- ジャンル画面構築 ----
function buildGenreGrid() {
  const grid = document.getElementById('genre-grid');
  const counts = {};
  RAW.forEach(r => { counts[r.genre] = (counts[r.genre] || 0) + 1; });

  Object.entries(GENRE_META).forEach(([key, meta]) => {
    const btn = document.createElement('button');
    btn.className = 'genre-btn';
    btn.innerHTML = `<div class="g-name">${meta.icon} ${meta.label}</div><div class="g-count">${counts[key] || 0}問</div>`;
    btn.onclick = () => startQuiz(key);
    grid.appendChild(btn);
  });
}

// ---- シャッフル ----
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ---- クイズ開始 ----
function startQuiz(genre) {
  currentGenre = genre;
  const pool = genre === 'all' ? [...RAW] : RAW.filter(r => r.genre === genre);
  deck = shuffle(pool).slice(0, Math.min(QUIZ_LEN, pool.length));
  pointer = 0;
  correctN = 0;
  wrongN = 0;

  document.getElementById('genre-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';

  showQuestion();
}

// ---- 問題表示 ----
function showQuestion() {
  answered = false;
  const q = deck[pointer];
  const total = deck.length;

  document.getElementById('prog-bar').style.width = (pointer / total * 100) + '%';
  document.getElementById('q-counter').textContent = (pointer + 1) + ' / ' + total;
  document.getElementById('sc-correct').textContent = correctN;
  document.getElementById('sc-wrong').textContent = wrongN;

  const meta = GENRE_META[q.genre] || { label: q.genre_ja, icon: '' };
  document.getElementById('q-genre').textContent = meta.icon + ' ' + meta.label;
  document.getElementById('q-abbr').textContent = q.abbr;
  document.getElementById('q-full').textContent = q.full || '';

  document.getElementById('feedback').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';

  // 選択肢生成
  const pool = currentGenre === 'all' ? RAW : RAW.filter(r => r.genre === currentGenre);
  const distractors = shuffle(pool.filter(r => r.meaning !== q.meaning && r.abbr !== q.abbr))
    .slice(0, 3)
    .map(r => r.meaning);

  const choices = shuffle([q.meaning, ...distractors]);
  const container = document.getElementById('choices');
  container.innerHTML = '';

  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.onclick = () => selectAnswer(btn, c, q.meaning, choices);
    container.appendChild(btn);
  });
}

// ---- 回答処理 ----
function selectAnswer(clickedBtn, selected, correct, allChoices) {
  if (answered) return;
  answered = true;

  const allBtns = document.querySelectorAll('.choice-btn');
  allBtns.forEach(b => {
    b.disabled = true;
    if (b.textContent === correct) b.classList.add('correct');
    else if (b === clickedBtn && selected !== correct) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const feedback = document.getElementById('feedback');
  if (selected === correct) {
    correctN++;
    feedback.className = 'feedback-box correct';
    feedback.textContent = '✓ 正解！';
  } else {
    wrongN++;
    feedback.className = 'feedback-box wrong';
    feedback.textContent = '✗ 不正解。正解は「' + correct + '」でした。';
  }
  feedback.style.display = 'block';
  document.getElementById('next-btn').style.display = 'block';
}

// ---- 次の問題 ----
function nextQuestion() {
  pointer++;
  if (pointer >= deck.length) {
    showResult();
  } else {
    showQuestion();
  }
}

// ---- リザルト ----
function showResult() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  const total = deck.length;
  const pct = Math.round(correctN / total * 100);

  let emoji = '😢', title = 'もう少し練習しよう';
  if (pct >= 90) { emoji = '🏆'; title = '完璧！！'; }
  else if (pct >= 70) { emoji = '🎉'; title = 'すごい！'; }
  else if (pct >= 50) { emoji = '💪'; title = 'いい調子！'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-score').textContent = pct + '%';
  document.getElementById('result-sub').textContent = total + '問中 ' + correctN + '問正解';
  document.getElementById('rs-correct').textContent = correctN;
  document.getElementById('rs-wrong').textContent = wrongN;
}

// ---- リトライ ----
function retryQuiz() { startQuiz(currentGenre); }

// ---- 戻る ----
function goGenreSelect() {
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('genre-screen').style.display = 'block';
}

buildGenreGrid();
</script>
