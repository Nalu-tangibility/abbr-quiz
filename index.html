<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>略語王への道👑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fdf6ff;--surface:#ffffff;--surface2:#f5eeff;--border:#e8d5ff;
  --text:#2d1b69;--text-sub:#9b7ec8;
  --accent:#a855f7;--accent2:#ec4899;--accent-light:#f3e8ff;
  --correct:#10b981;--correct-light:#d1fae5;
  --wrong:#f43f5e;--wrong-light:#ffe4e6;
  --gold:#f59e0b;--shadow:rgba(168,85,247,0.15);
}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans JP',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;padding:20px 16px 60px;overflow-x:hidden;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle,#e9d5ff 1.5px,transparent 1.5px);
  background-size:28px 28px;opacity:0.5;pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;top:0;left:0;right:0;height:280px;
  background:linear-gradient(180deg,#f3e8ff 0%,transparent 100%);
  pointer-events:none;z-index:0;
}
body>*{position:relative;z-index:1}

/* 音量トグル */
.sound-toggle{
  position:fixed;top:16px;right:16px;z-index:50;
  width:40px;height:40px;border-radius:12px;
  border:2px solid var(--border);background:var(--surface);
  cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;box-shadow:0 2px 8px var(--shadow);
}
.sound-toggle:hover{border-color:var(--accent);background:var(--accent-light)}
.sound-toggle.muted{opacity:0.5}

/* ---- ホーム ---- */
#home-screen{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;padding-top:12px}
.home-mascot{font-size:80px;margin-bottom:8px;animation:float 3s ease-in-out infinite;display:block;text-align:center}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.home-title{
  font-family:'Nunito',sans-serif;font-size:38px;font-weight:900;
  text-align:center;margin-bottom:6px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2;
}
.home-sub{font-size:13px;color:var(--text-sub);text-align:center;margin-bottom:32px}
.home-stats-row{display:flex;gap:12px;margin-bottom:32px;width:100%;justify-content:center}
.home-stat{
  background:var(--surface);border:2px solid var(--border);border-radius:16px;
  padding:14px 20px;text-align:center;flex:1;max-width:130px;
  box-shadow:0 4px 16px var(--shadow);
}
.home-stat .hs-num{font-family:'Nunito',sans-serif;font-size:28px;font-weight:900;color:var(--accent);line-height:1}
.home-stat .hs-label{font-size:11px;color:var(--text-sub);margin-top:3px;font-weight:700}
.home-play-btn{
  width:100%;padding:18px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:none;border-radius:20px;font-size:18px;font-weight:900;
  cursor:pointer;margin-bottom:12px;font-family:'Nunito',sans-serif;
  letter-spacing:0.03em;box-shadow:0 8px 24px rgba(168,85,247,0.35);
  transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.home-play-btn:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(168,85,247,0.45)}
.home-play-btn:active{transform:translateY(0)}
.home-genre-btn{
  width:100%;padding:15px;background:var(--surface);color:var(--accent);
  border:2px solid var(--border);border-radius:20px;font-size:15px;font-weight:700;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;
  transition:all 0.2s;box-shadow:0 4px 12px var(--shadow);
}
.home-genre-btn:hover{border-color:var(--accent);background:var(--accent-light)}
.home-deco{display:flex;gap:16px;margin-top:28px;font-size:28px;opacity:0.4}

.weak-btn{
  width:100%;margin-top:12px;padding:15px 20px;
  background:var(--wrong-light);
  border:2px solid #fda4af;
  border-radius:18px;font-size:15px;font-weight:700;
  color:var(--wrong);cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  transition:all 0.2s;font-family:'Noto Sans JP',sans-serif;
  box-shadow:0 4px 12px rgba(244,63,94,0.12);
}
.weak-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(244,63,94,0.2);border-color:var(--wrong)}
.weak-badge{
  background:var(--wrong);color:#fff;
  padding:3px 10px;border-radius:20px;
  font-size:12px;font-weight:900;font-family:'Nunito',sans-serif;
}
.weak-clear-btn{
  margin-top:8px;background:none;border:none;
  color:var(--text-sub);font-size:11px;cursor:pointer;
  text-decoration:underline;font-family:'Noto Sans JP',sans-serif;
  padding:4px;
}
.weak-clear-btn:hover{color:var(--wrong)}

/* ---- ジャンル ---- */
#genre-screen{width:100%;max-width:480px;display:none}
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-icon-btn{
  width:40px;height:40px;border-radius:12px;border:2px solid var(--border);
  background:var(--surface);cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;
}
.back-icon-btn:hover{border-color:var(--accent);background:var(--accent-light)}
.page-title{font-family:'Nunito',sans-serif;font-size:22px;font-weight:900;color:var(--text)}
.genre-all-btn{
  width:100%;background:linear-gradient(135deg,#f3e8ff,#fce7f3);
  border:2px solid var(--border);border-radius:18px;padding:18px 20px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
  transition:all 0.2s;box-shadow:0 4px 16px var(--shadow);
}
.genre-all-btn:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px var(--shadow)}
.genre-all-btn .g-name{font-size:16px;font-weight:900;color:var(--accent);font-family:'Nunito',sans-serif}
.genre-all-btn .g-count{font-size:13px;color:var(--text-sub);font-weight:700}
.genre-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.genre-btn{
  background:var(--surface);border:2px solid var(--border);border-radius:16px;
  padding:16px 14px;cursor:pointer;text-align:left;transition:all 0.2s;
  box-shadow:0 2px 8px var(--shadow);
}
.genre-btn:hover{border-color:var(--accent);background:var(--accent-light);transform:translateY(-2px);box-shadow:0 6px 20px var(--shadow)}
.genre-btn .g-icon{font-size:26px;margin-bottom:6px;display:block}
.genre-btn .g-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px}
.genre-btn .g-count{font-size:11px;color:var(--text-sub)}

/* ---- クイズ ---- */
#quiz-screen{display:none;width:100%;max-width:480px}
.quiz-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prog-wrap{flex:1;height:10px;background:var(--border);border-radius:5px;overflow:hidden}
.prog-bar{
  height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:5px;transition:width 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.q-num-badge{
  background:var(--surface);border:2px solid var(--border);border-radius:10px;
  padding:4px 12px;font-size:12px;font-weight:700;color:var(--text-sub);white-space:nowrap;
}
.score-row{display:flex;gap:6px;margin-bottom:14px;align-items:center;flex-wrap:nowrap;overflow:hidden;min-width:0}
.chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;border:2px solid;white-space:nowrap;flex-shrink:0}
.chip-ok{border-color:var(--correct);color:var(--correct);background:var(--correct-light)}
.chip-ng{border-color:var(--wrong);color:var(--wrong);background:var(--wrong-light)}
.combo-badge{
  margin-left:auto;padding:4px 10px;border-radius:20px;font-size:11px;
  font-weight:900;font-family:'Nunito',sans-serif;transition:all 0.3s;opacity:0;transform:scale(0.8);
  white-space:nowrap;flex-shrink:0;max-width:160px;overflow:hidden;text-overflow:ellipsis;
}
.combo-badge.show{opacity:1;transform:scale(1)}
.cb1{background:#e0f2fe;color:#0284c7;border:2px solid #bae6fd}
.cb2{background:#d1fae5;color:#059669;border:2px solid #a7f3d0}
.cb3{background:#fef3c7;color:#d97706;border:2px solid #fde68a}
.cb4{background:#ffe4e6;color:#e11d48;border:2px solid #fecdd3}
.cb5{background:linear-gradient(135deg,#f3e8ff,#fce7f3);color:var(--accent);border:2px solid var(--border);animation:comboPulse 0.8s ease infinite}
.cb-god{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:2px solid var(--accent);animation:comboPulse 0.4s ease infinite;box-shadow:0 0 10px rgba(168,85,247,0.5)}
.cb6{background:linear-gradient(135deg,#fce7f3,#ffe4e6);color:#db2777;border:2px solid #fbcfe8;animation:comboPulse 0.7s ease infinite}
.cb7{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#b45309;border:2px solid #fcd34d;animation:comboPulse 0.6s ease infinite}
.cb8{background:linear-gradient(135deg,#ffe4e6,#fecdd3);color:#be123c;border:2px solid #fda4af;animation:comboPulse 0.5s ease infinite}
.cb9{background:linear-gradient(135deg,#f3e8ff,#e0f2fe);color:#7c3aed;border:2px solid #c4b5fd;animation:comboPulse 0.4s ease infinite}
.cb10{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:2px solid var(--accent);animation:comboPulse 0.3s ease infinite;box-shadow:0 0 12px rgba(168,85,247,0.4)}
@keyframes comboPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

.q-card{
  background:var(--surface);border:2px solid var(--border);border-radius:24px;
  padding:28px 24px 24px;text-align:center;margin-bottom:14px;
  box-shadow:0 8px 32px var(--shadow);
  transition:border-color 0.3s,box-shadow 0.3s,transform 0.15s;
  position:relative;overflow:hidden;
}
.q-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:24px 24px 0 0;
}
.q-card.flash-correct{border-color:var(--correct);box-shadow:0 8px 40px rgba(16,185,129,0.25);animation:bumpCorrect 0.35s cubic-bezier(0.34,1.56,0.64,1)}
.q-card.flash-wrong{border-color:var(--wrong);box-shadow:0 8px 40px rgba(244,63,94,0.2);animation:shakeCard 0.35s ease}
@keyframes bumpCorrect{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shakeCard{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.q-genre-tag{
  display:inline-block;font-size:11px;font-weight:700;color:var(--accent);
  background:var(--accent-light);border:1.5px solid var(--border);
  padding:3px 12px;border-radius:20px;margin-bottom:16px;letter-spacing:0.04em;
}
.q-prompt{font-size:12px;color:var(--text-sub);margin-bottom:8px;font-weight:700;letter-spacing:0.08em}
.q-abbr{
  font-family:'Nunito',sans-serif;font-size:58px;font-weight:900;line-height:1.1;
  margin-bottom:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.q-full{font-size:12px;color:var(--text-sub);min-height:16px;font-weight:500}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.choice-btn{
  background:var(--surface);border:2px solid var(--border);border-radius:16px;
  padding:16px 12px;font-size:13px;font-weight:700;cursor:pointer;
  text-align:center;line-height:1.4;transition:all 0.15s;color:var(--text);
  font-family:'Noto Sans JP',sans-serif;box-shadow:0 2px 8px var(--shadow);
}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-light);transform:translateY(-3px);box-shadow:0 6px 20px var(--shadow)}
.choice-btn:disabled{cursor:default}
.choice-btn.correct{border-color:var(--correct);background:var(--correct-light);color:var(--correct);box-shadow:0 4px 16px rgba(16,185,129,0.2);animation:popIn 0.35s cubic-bezier(0.34,1.56,0.64,1)}
.choice-btn.wrong{border-color:var(--wrong);background:var(--wrong-light);color:var(--wrong);animation:shakeChoice 0.35s ease}
.choice-btn.dim{opacity:0.3;transform:none!important;box-shadow:none!important}
@keyframes popIn{0%{transform:scale(0.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shakeChoice{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.feedback-box{border-radius:16px;padding:12px 16px;margin-bottom:12px;font-size:13px;line-height:1.6;display:none;border:2px solid;font-weight:700}
.feedback-box.correct{background:var(--correct-light);border-color:#6ee7b7;color:#065f46}
.feedback-box.wrong{background:var(--wrong-light);border-color:#fda4af;color:#9f1239}
.feedback-box .ans-highlight{font-weight:900;color:var(--correct)}

.next-btn{
  width:100%;padding:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:none;border-radius:16px;font-size:15px;font-weight:900;
  cursor:pointer;display:none;font-family:'Nunito',sans-serif;letter-spacing:0.03em;
  box-shadow:0 6px 20px rgba(168,85,247,0.3);transition:all 0.2s;
}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(168,85,247,0.4)}

/* パーティクル */
#particle-canvas{position:fixed;inset:0;pointer-events:none;z-index:100}

/* コンボポップアップ */
#combo-popup{
  position:fixed;top:32%;left:50%;transform:translate(-50%,-50%);
  font-family:'Nunito',sans-serif;font-size:60px;font-weight:900;
  pointer-events:none;z-index:200;opacity:0;text-align:center;
  text-shadow:0 4px 20px rgba(0,0,0,0.15);
}
@keyframes comboAnim{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.4) rotate(-8deg)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0deg)}
  100%{opacity:0;transform:translate(-50%,-65%) scale(0.85) rotate(0deg)}
}

/* ---- リザルト ---- */
#result-screen{display:none;width:100%;max-width:480px}
.result-card{
  background:var(--surface);border:2px solid var(--border);border-radius:24px;
  padding:36px 24px 28px;text-align:center;margin-bottom:14px;
  box-shadow:0 8px 32px var(--shadow),0 0 0 4px rgba(168,85,247,0.08);
  position:relative;overflow:hidden;
}
.result-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--gold),var(--accent2),var(--accent),var(--correct));
  border-radius:24px 24px 0 0;
}
.result-card::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(168,85,247,0.07) 0%,transparent 70%);
  pointer-events:none;
}
.result-mascot{font-size:72px;display:block;margin-bottom:8px;animation:float 2.5s ease-in-out infinite}
.result-title{
  font-family:'Nunito',sans-serif;font-size:36px;font-weight:900;margin-bottom:6px;
  background:linear-gradient(135deg,var(--gold),var(--accent2),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 2px 6px rgba(168,85,247,0.25));
}
.result-pct{
  font-family:'Nunito',sans-serif;font-size:80px;font-weight:900;line-height:1;
  background:linear-gradient(135deg,var(--accent),var(--accent2),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin:10px 0 4px;filter:drop-shadow(0 2px 8px rgba(168,85,247,0.3));
}
.result-sub{font-size:13px;color:var(--text-sub);margin-bottom:20px;font-weight:700}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:0}
.stat-box{
  background:var(--surface2);border:2px solid var(--border);border-radius:16px;
  padding:16px 8px;text-align:center;
  box-shadow:0 4px 12px var(--shadow);
  position:relative;overflow:hidden;
}
.stat-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.sbox-ok::before{background:linear-gradient(90deg,var(--correct),#34d399)}
.sbox-ng::before{background:linear-gradient(90deg,var(--wrong),#fb7185)}
.sbox-combo::before{background:linear-gradient(90deg,var(--gold),#fbbf24)}
.stat-box .s-num{font-family:'Nunito',sans-serif;font-size:32px;font-weight:900;line-height:1}
.stat-box .s-label{font-size:10px;color:var(--text-sub);margin-top:4px;font-weight:700;letter-spacing:0.05em}
.sbox-ok .s-num{color:var(--correct)}.sbox-ng .s-num{color:var(--wrong)}.sbox-combo .s-num{color:var(--gold)}
.miss-section{margin-top:20px;text-align:left}
.miss-title{font-size:11px;font-weight:900;letter-spacing:0.15em;color:var(--text-sub);text-transform:uppercase;margin-bottom:10px}
.miss-item{background:var(--surface2);border:2px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.miss-abbr{font-family:'Nunito',sans-serif;font-size:20px;font-weight:900;color:var(--wrong);min-width:56px;text-align:center}
.miss-meaning{font-size:13px;font-weight:700;color:var(--text);margin-bottom:1px}
.miss-full{font-size:11px;color:var(--text-sub)}
.retry-btn{
  width:100%;padding:18px;
  background:linear-gradient(135deg,var(--accent),var(--accent2),var(--gold));
  background-size:200% 200%;
  color:#fff;border:none;border-radius:18px;font-size:17px;font-weight:900;
  cursor:pointer;margin-bottom:10px;font-family:'Nunito',sans-serif;
  box-shadow:0 8px 28px rgba(168,85,247,0.4),0 0 0 0 rgba(168,85,247,0.2);
  transition:all 0.2s;
  animation:btnPulse 2.5s ease infinite;
  letter-spacing:0.03em;
}
.retry-btn:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(168,85,247,0.5);animation:none}
@keyframes btnPulse{
  0%,100%{box-shadow:0 8px 28px rgba(168,85,247,0.4),0 0 0 0 rgba(168,85,247,0.3)}
  50%{box-shadow:0 8px 28px rgba(168,85,247,0.4),0 0 0 10px rgba(168,85,247,0)}
}
.home-back-btn{width:100%;padding:14px;background:var(--surface);border:2px solid var(--border);border-radius:18px;font-size:14px;font-weight:700;color:var(--text-sub);cursor:pointer;transition:all 0.2s;font-family:'Noto Sans JP',sans-serif}
.home-back-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}

/* ---- レスポンシブ ---- */
@media(max-width:480px){
  .home-title{font-size:30px}.home-mascot{font-size:64px}
  .q-abbr{font-size:46px}.result-pct{font-size:58px}
  .result-title{font-size:28px}.result-mascot{font-size:58px}
  .home-stats-row{gap:8px}.home-stat{padding:12px 14px}.home-stat .hs-num{font-size:22px}
}
@media(max-width:360px){
  .q-abbr{font-size:38px}.choices{grid-template-columns:1fr}.home-title{font-size:26px}
}
@media(min-width:640px){
  body{padding:32px 24px 80px}
  .q-abbr{font-size:72px}.home-title{font-size:44px}
  .home-mascot{font-size:96px}.result-mascot{font-size:80px}
  .result-pct{font-size:88px}.result-title{font-size:40px}
}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:slideUp 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards}
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>
<div id="combo-popup"></div>

<!-- 音量トグル -->
<button class="sound-toggle" id="sound-toggle" onclick="toggleSound()" title="音のON/OFF">🔊</button>

<!-- ホーム -->
<div id="home-screen">
  <span class="home-mascot">🧠</span>
  <div class="home-title">略語王への道👑</div>
  <div class="home-sub">497問収録 · 9ジャンル · 4択形式</div>

// ---- Web Audio Sound Engine ----
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let ac=null;
function getAC(){
  if(!ac)ac=new AudioCtx();
  if(ac.state==='suspended')ac.resume();
  return ac;
}
function playTone(freq,type,t,dur,vol,fade=true){
  const a=getAC();
  const osc=a.createOscillator();
  const g=a.createGain();
  osc.connect(g);g.connect(a.destination);
  osc.type=type;
  osc.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol,t);
  if(fade)g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  osc.start(t);osc.stop(t+dur+0.01);
}
function sfx(fn){if(soundOn)fn()}

function sfxCorrect(){
  const a=getAC(),t=a.currentTime;
  playTone(523,'sine',t,0.12,0.35);
  playTone(784,'sine',t+0.1,0.18,0.3);
}
function sfxCombo(n){
  const a=getAC(),t=a.currentTime;
  let f=0,vol=0.35;
  if(n>=30){f=1760;vol=0.5;}
  else if(n>=15){f=1319;vol=0.42;}
  else if(n>=10){f=1047;vol=0.4;}
  else if(n>=5){f=784;vol=0.38;}
  else if(n>=2){f=659;vol=0.32;}
  if(!f)return;
  playTone(f,'sine',t,0.1,vol);
  playTone(f*1.5,'triangle',t+0.07,0.12,vol*0.55);
  if(n>=10)playTone(f*2,'sine',t+0.12,0.08,vol*0.35);
}
function sfxWrong(){
  const a=getAC(),t=a.currentTime;
  playTone(280,'sawtooth',t,0.1,0.28);
  playTone(200,'sawtooth',t+0.09,0.15,0.22);
}

  const a=getAC(),t=a.currentTime;
  [262,330,392,523].forEach((f,i)=>playTone(f,'sine',t+i*0.07,0.15,0.28));
}

  [392,4],[440,4.5],[523,5],[587,5.5],
  [523,6],[440,6.5],[392,7],[330,7.5],
];

function playBGMLoop(melody, loopLen=8) {
  if (!soundOn) return;
  const a = getAC();
  const startTime = a.currentTime + 0.05;

  melody.forEach(([freq, beat]) => {
    const t = startTime + beat * BGM_BEAT;
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.connect(gain); gain.connect(a.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.06, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + BGM_BEAT * 0.8);
    osc.start(t); osc.stop(t + BGM_BEAT * 0.85);
    bgmNodes.push(osc);
  });

  return startTime + loopLen * BGM_BEAT;
}

let bgmMode = '';
let bgmNextTime = 0;
let bgmRAF = null;

function startBGM(mode) {
  if (!soundOn) return;
  stopBGM();
  bgmMode = mode;
  bgmPlaying = true;
  scheduleBGM();
}

function scheduleBGM() {
  if (!bgmPlaying || !soundOn) return;
  const a = getAC();
  if (a.currentTime >= bgmNextTime - 0.1) {
    const melody = bgmMode === 'home' ? HOME_MELODY : QUIZ_MELODY;
    const loopLen = bgmMode === 'home' ? 16 : 8;
    bgmNextTime = playBGMLoop(melody, loopLen);
  }
  bgmRAF = setTimeout(scheduleBGM, 500);
}

function stopBGM() {
  bgmPlaying = false;
  if (bgmRAF) { clearTimeout(bgmRAF); bgmRAF = null; }
  bgmNodes.forEach(n => { try { n.stop(); } catch(e) {} });
  bgmNodes = [];
  bgmNextTime = 0;
}

// ---- パーティクル ----
const canvas=document.getElementById('particle-canvas');
const ctx=canvas.getContext('2d');
let particles=[];
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
resizeCanvas();window.addEventListener('resize',resizeCanvas);
function spawnParticles(x,y,colors,count=28){
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2,speed=Math.random()*7+2;
    const color=colors[Math.floor(Math.random()*colors.length)];
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-4,
      life:1,decay:Math.random()*0.02+0.018,size:Math.random()*6+3,color,
      shape:Math.random()>0.5?'circle':'square'});
  }
}
function animParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life-=p.decay;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();
    if(p.shape==='square')ctx.rect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    else ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;
  if(particles.length>0)requestAnimationFrame(animParticles);
}
function triggerParticles(el,colors){
  const r=el.getBoundingClientRect();
  spawnParticles(r.left+r.width/2,r.top+r.height/2,colors);
  animParticles();
}

// ---- コンボポップアップ ----
function showComboPopup(n){
  const el=document.getElementById('combo-popup');
  let text='', color='', size='60px';
  if(n>=30){text='GODLIKE...';color='#a855f7';size='72px';}
  else if(n>=15){text='FEVER STREAK!';color='#e11d48';size='52px';}
  else if(n>=10){text='SUPER FEVER!!';color='#d97706';size='46px';}
  else if(n>=5){text='FEVER! 🔥';color='#059669';size='60px';}
  else if(n>=2){text='DOUBLE!';color='#0284c7';size='60px';}
  else return;
  el.textContent=text;
  el.style.color=color;
  el.style.fontSize=size;
  el.style.animation='none';void el.offsetHeight;
  el.style.animation='comboAnim 1.2s ease forwards';
}

// ---- ナビゲーション ----
function show(id){
  ['home-screen','genre-screen','quiz-screen','result-screen']
    .forEach(s=>document.getElementById(s).style.display=s===id?'block':'none');
}
function goHome(){show('home-screen');startBGM('home')}
function goGenre(){show('genre-screen');stopBGM()}

// ---- ジャンルグリッド ----
function buildGenre(){
  const grid=document.getElementById('genre-grid');
  const counts={};RAW.forEach(r=>{counts[r.genre]=(counts[r.genre]||0)+1});
  Object.entries(GENRE_META).forEach(([key,meta])=>{
    const btn=document.createElement('button');
    btn.className='genre-btn';
    btn.innerHTML=`<span class="g-icon">${meta.icon}</span><div class="g-name">${meta.label}</div><div class="g-count">${counts[key]||0}問</div>`;
    btn.onclick=()=>startQuiz(key);
    grid.appendChild(btn);
  });
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ---- クイズ開始 ----
function startQuiz(genre){
  currentGenre=genre;
  const pool=genre==='all'?[...RAW]:genre==='__weak__'?loadWeak():RAW.filter(r=>r.genre===genre);
  deck=shuffle(pool).slice(0,Math.min(QUIZ_LEN,pool.length));
  pointer=0;correctN=0;wrongN=0;missedQ=[];  // combo・maxComboはリセットしない
  show('quiz-screen');
  sfx(sfxStart);
  setTimeout(()=>startBGM('quiz'),400);
  showQ();
}

// ---- 問題表示 ----
function showQ(){
  answered=false;
  const q=deck[pointer],total=deck.length;
  document.getElementById('prog-bar').style.width=(pointer/total*100)+'%';
  document.getElementById('q-num').textContent=(pointer+1)+'/'+total;
  document.getElementById('sc-ok').textContent=correctN;
  document.getElementById('sc-ng').textContent=wrongN;
  const meta=GENRE_META[q.genre]||{label:q.genre_ja,icon:''};
  document.getElementById('q-genre').textContent=meta.icon+' '+meta.label;
  document.getElementById('q-abbr').textContent=q.abbr;
  document.getElementById('q-full').textContent=q.full||'';
  document.getElementById('feedback').style.display='none';
  document.getElementById('next-btn').style.display='none';
  document.getElementById('q-card').className='q-card animate-in';
  updateCombo();

  const pool=currentGenre==='all'||currentGenre==='__weak__'?RAW:RAW.filter(r=>r.genre===currentGenre);
  const distractors=shuffle(pool.filter(r=>r.meaning!==q.meaning&&r.abbr!==q.abbr)).slice(0,3).map(r=>r.meaning);
  const choices=shuffle([q.meaning,...distractors]);
  const cont=document.getElementById('choices');cont.innerHTML='';
  choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';btn.textContent=c;
    btn.onclick=()=>answer(btn,c,q);
    cont.appendChild(btn);
  });
}

function getComboInfo(n){
  if(n>=30) return {text:'GODLIKE...',cls:'cb-god'};
  if(n>=15) return {text:'FEVER STREAK!',cls:'cb5'};
  if(n>=10) return {text:'SUPER FEVER!!',cls:'cb4'};
  if(n>=5)  return {text:'FEVER! 🔥',cls:'cb3'};
  if(n>=2)  return {text:'DOUBLE!',cls:'cb1'};
  return null;
}

function updateCombo(){
  const el=document.getElementById('combo-badge');
  const info=getComboInfo(combo);
  if(info){
    el.textContent=info.text;
    el.className='combo-badge show '+info.cls;
  } else {
    el.className='combo-badge';
  }
}

// ---- 回答 ----
function answer(clickedBtn,selected,q){
  if(answered)return;
  answered=true;
  const correct=q.meaning;
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled=true;
    if(b.textContent===correct)b.classList.add('correct');
    else if(b===clickedBtn&&selected!==correct)b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const fb=document.getElementById('feedback');
  const card=document.getElementById('q-card');
  if(selected===correct){
    correctN++;combo++;if(combo>maxCombo)maxCombo=combo;
    card.classList.add('flash-correct');
    triggerParticles(clickedBtn,['#a855f7','#ec4899','#f59e0b','#10b981']);
    removeFromWeak(q);
    const showPopup = combo===2||combo===5||combo===10||(combo>=15&&combo%5===0);
    if(showPopup) showComboPopup(combo);
    sfx(sfxCorrect);
    if(showPopup)setTimeout(()=>sfx(()=>sfxCombo(combo)),150);
    fb.className='feedback-box correct';
    fb.innerHTML='✓ 正解！'+(q.full?`<br><span style="font-size:11px;font-weight:500">${q.full}</span>`:'');
  } else {
    wrongN++;combo=0;
    card.classList.add('flash-wrong');
    triggerParticles(clickedBtn,['#f43f5e','#fda4af']);
    missedQ.push(q);
    addToWeak(q);
    sfx(sfxWrong);
    fb.className='feedback-box wrong';
    fb.innerHTML=`✗ 不正解。正解は <span class="ans-highlight">「${correct}」</span><br><span style="font-size:11px;font-weight:500">${q.full||''}</span>`;
  }
  fb.style.display='block';
  document.getElementById('next-btn').style.display='block';
  document.getElementById('sc-ok').textContent=correctN;
  document.getElementById('sc-ng').textContent=wrongN;
  updateCombo();
}

function nextQ(){
  sfx(sfxNext);
  pointer++;pointer>=deck.length?showResult():showQ();
}

// ---- リザルト ----
function showResult(){
  show('result-screen');
  stopBGM();
  const total=deck.length,pct=Math.round(correctN/total*100);
  let mascot='😢',title='もう少し！';
  if(pct>=90){mascot='🏆';title='パーフェクト！';setTimeout(()=>sfx(sfxFanfare),300)}
  else if(pct>=70){mascot='🎉';title='すごい！';setTimeout(()=>sfx(sfxFanfare),300)}
  else if(pct>=50){mascot='💪';title='いい感じ！';setTimeout(()=>sfx(sfxSad),300)}
  else{setTimeout(()=>sfx(sfxSad),300)}
  document.getElementById('r-mascot').textContent=mascot;
  document.getElementById('r-title').textContent=title;
  document.getElementById('r-pct').textContent=pct+'%';
  document.getElementById('r-sub').textContent=total+'問中 '+correctN+'問正解';
  document.getElementById('r-ok').textContent=correctN;
  document.getElementById('r-ng').textContent=wrongN;
  document.getElementById('r-combo').textContent=maxCombo;
  const ms=document.getElementById('miss-section');
  if(missedQ.length>0){
    ms.innerHTML='<div class="miss-title">間違えた問題の復習</div>'+
      missedQ.map(q=>`<div class="miss-item"><div class="miss-abbr">${q.abbr}</div><div><div class="miss-meaning">${q.meaning}</div><div class="miss-full">${q.full||''}</div></div></div>`).join('');
  } else {
    ms.innerHTML='<div style="text-align:center;color:var(--correct);font-weight:900;margin-top:16px;font-size:15px">🌟 全問正解！完璧です！</div>';
  }
  // スコア別パーティクル演出
  const fireworks = () => {
    const cols1=['#a855f7','#ec4899','#f59e0b','#fff'];
    const cols2=['#10b981','#06b6d4','#fbbf24','#fff'];
    const cx=window.innerWidth/2, cy=window.innerHeight*0.3;
    if(pct>=90){
      spawnParticles(cx,cy,cols1,60);
      setTimeout(()=>{spawnParticles(cx*0.4,cy*1.1,cols2,50);spawnParticles(cx*1.6,cy*1.1,cols1,50)},300);
      setTimeout(()=>{spawnParticles(cx,cy*0.5,['#ffd700','#fff','#a855f7'],70)},600);
    } else if(pct>=70){
      spawnParticles(cx*0.4,cy,cols1,45);
      spawnParticles(cx*1.6,cy,cols2,45);
      setTimeout(()=>spawnParticles(cx,cy*1.2,cols1,40),350);
    } else if(pct>=50){
      spawnParticles(cx,cy,cols2,35);
    }
    animParticles();
  };
  setTimeout(fireworks,350);
}

function retryQuiz(){startQuiz(currentGenre)}


// ---- 苦手問題集 (localStorage) ----
const WEAK_KEY = 'ryakugo_weak_v1';

function loadWeak() {
  try {
    return JSON.parse(localStorage.getItem(WEAK_KEY) || '[]');
  } catch(e) { return []; }
}

function saveWeak(arr) {
  try { localStorage.setItem(WEAK_KEY, JSON.stringify(arr)); } catch(e) {}
}

// 間違えた問題を蓄積（abbrをキーに重複排除）
function addToWeak(q) {
  const arr = loadWeak();
  const exists = arr.some(w => w.abbr === q.abbr && w.genre === q.genre);
  if (!exists) arr.push({genre:q.genre,genre_ja:q.genre_ja,abbr:q.abbr,full:q.full,meaning:q.meaning});
  saveWeak(arr);
  updateWeakBtn();
}

// 正解したら苦手リストから削除
function removeFromWeak(q) {
  const arr = loadWeak().filter(w => !(w.abbr === q.abbr && w.genre === q.genre));
  saveWeak(arr);
  updateWeakBtn();
}

function clearWeak() {
  saveWeak([]);
  updateWeakBtn();
}

function updateWeakBtn() {
  const arr = loadWeak();
  const btn = document.getElementById('weak-btn');
  const badge = document.getElementById('weak-count');
  if (!btn) return;
  if (arr.length === 0) {
    btn.style.display = 'none';
  } else {
    btn.style.display = 'flex';
    badge.textContent = arr.length;
  }
}

function startWeakQuiz() {
  const arr = loadWeak();
  if (arr.length === 0) return;
  currentGenre = '__weak__';
  deck = shuffle([...arr]).slice(0, Math.min(QUIZ_LEN, arr.length));
  pointer = 0; correctN = 0; wrongN = 0; missedQ = [];
  show('quiz-screen');
  sfx(sfxStart);
  setTimeout(() => startBGM('quiz'), 400);
  showQ();
}

buildGenre();
updateWeakBtn();
</script>
